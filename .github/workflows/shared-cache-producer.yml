name: Java CI shared-cache producer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/shared-cache-producer.yml'
      - '.github/workflows/shared-cache-consumer.yml'
      - 'harness/discover.py'
      - 'harness/run_case.py'
      - 'harness/run_fresh_case.py'
      - 'candidates/maven-build-cache/**'
      - 'fixture/**'
      - 'tests/cases/CI-15-cross-workflow-cache-reuse.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERIMENT_SOURCE_REVISION: ${{ github.sha }}

jobs:
  discover:
    name: Discover cross-workflow cases
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      cases: ${{ steps.matrix.outputs.cross_workflow_reuse_cases }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPERIMENT_SOURCE_REVISION }}
          persist-credentials: false
          fetch-depth: 1
      - name: Discover cases
        id: matrix
        run: python3 harness/discover.py

  produce:
    name: Shared cache producer / ${{ matrix.case }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.discover.outputs.cases) }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPERIMENT_SOURCE_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: fixture/**/pom.xml

      - name: Prepare exact Maven Wrapper
        working-directory: fixture
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper \
            -Dmaven=3.9.16 \
            -Dtype=only-script \
            -DdistributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
          chmod +x mvnw
          ./mvnw --version

      - name: Produce Maven build cache
        shell: bash
        run: |
          python3 harness/run_fresh_case.py \
            --case '${{ matrix.case }}' \
            --candidate maven-build-cache \
            --phase producer \
            --cache-dir '${{ runner.temp }}/java-ci-cross-workflow-cache/${{ strategy.job-index }}' \
            --results-dir 'results/_ci/cross-workflow-producer-${{ strategy.job-index }}'

      - name: Save exact producer cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/java-ci-cross-workflow-cache/${{ strategy.job-index }}
          key: java-ci-cross-workflow-${{ env.EXPERIMENT_SOURCE_REVISION }}-${{ github.run_id }}-${{ strategy.job-index }}

      - name: Add readable producer summary
        if: always()
        shell: bash
        run: cat 'results/_ci/cross-workflow-producer-${{ strategy.job-index }}/README.md' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-ci-cross-workflow-producer-${{ strategy.job-index }}
          path: results/_ci/cross-workflow-producer-${{ strategy.job-index }}
          if-no-files-found: error
          retention-days: 14
