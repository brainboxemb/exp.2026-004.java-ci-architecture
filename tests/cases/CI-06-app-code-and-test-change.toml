id = "CI-06"
title = "Application code and unit-test change"
question = "What production compilation, test compilation, test execution and packaging work is repeated when application code and its unit test change together?"

[setup]
mode = "warm"

[[changes]]
path = "app/src/main/java/org/brainboxemb/ci/App.java"
operation = "replace"
find = "return featureA + \"+\" + featureB;"
replace = "return featureA + \"|\" + featureB;"

[[changes]]
path = "app/src/test/java/org/brainboxemb/ci/AppTest.java"
operation = "replace"
find = "assertEquals(\"core-a+core-b\", App.message());"
replace = "assertEquals(\"core-a|core-b\", App.message());"

[expect]
tests_pass = true
expected_test_reports = 5
required_artifacts = [
  "core/target/core-1.0.0-SNAPSHOT.jar",
  "feature-a/target/feature-a-1.0.0-SNAPSHOT.jar",
  "feature-b/target/feature-b-1.0.0-SNAPSHOT.jar",
  "app/target/app-1.0.0-SNAPSHOT.jar",
]

[expect.candidates.maven-build-cache.workset]
artifact_outputs_payload_changed = 1
test_reports_content_changed = 2

[expect.candidates.maven-build-cache.native_cache_sources]
core = "LOCAL"
feature-a = "LOCAL"
feature-b = "LOCAL"
app = "BUILD"
