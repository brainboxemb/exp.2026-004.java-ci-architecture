id = "CI-15"
title = "Cross-workflow Maven build-cache reuse"
question = "Can a later GitHub Actions workflow run restore and reuse Maven module state produced by an earlier workflow run for the exact same source and runtime identity?"

[setup]
mode = "cross-workflow-cache-reuse"

[qualification]
candidate = "maven-build-cache"

[expect]
tests_pass = true
expected_test_reports = 5
required_artifacts = [
  "core/target/core-1.0.0-SNAPSHOT.jar",
  "feature-a/target/feature-a-1.0.0-SNAPSHOT.jar",
  "feature-b/target/feature-b-1.0.0-SNAPSHOT.jar",
  "app/target/app-1.0.0-SNAPSHOT.jar",
]

[expect.cross_run]
transport_hit = true

[expect.candidates.maven-build-cache.native_cache_sources]
core = "LOCAL"
feature-a = "LOCAL"
feature-b = "LOCAL"
app = "LOCAL"
