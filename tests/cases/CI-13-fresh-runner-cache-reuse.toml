id = "CI-13"
title = "Fresh-runner Maven build-cache reuse"
question = "Can a fresh hosted runner with an empty worktree reuse Maven module outputs produced on another runner when GitHub transports only Maven's local build-cache directory?"

[setup]
mode = "fresh-cache-reuse"

[qualification]
candidate = "maven-build-cache"

[expect]
tests_pass = true
expected_test_reports = 5
required_artifacts = [
  "core/target/core-1.0.0-SNAPSHOT.jar",
  "feature-a/target/feature-a-1.0.0-SNAPSHOT.jar",
  "feature-b/target/feature-b-1.0.0-SNAPSHOT.jar",
  "app/target/app-1.0.0-SNAPSHOT.jar",
]

[expect.cross_run]
transport_hit = true

[expect.candidates.maven-build-cache.native_cache_sources]
core = "LOCAL"
feature-a = "LOCAL"
feature-b = "LOCAL"
app = "LOCAL"
